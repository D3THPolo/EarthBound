<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>EarthBound Clothing</title>

  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f2ec;
      color: #333;
    }

    header {
      background-color: #3e3d36;
      color: #e8e4d9;
      padding: 20px 40px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-family: 'Georgia', serif;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap; /* Allow wrapping of the navigation links */
    }

    nav a {
      text-decoration: none;
      color: #e8e4d9;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
    }

    nav a i {
      margin-right: 8px;
    }

    nav a:hover {
      color: #d1b172;
    }

    /* Navigation styling consistency */
    .slogan-section {
      background-color: #d9ccb2;
      padding: 80px 20px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .slogan {
      font-size: 2rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(30px) rotate(15deg);
      color: #3e3d36;
      animation: stepIn 1.5s ease-out forwards;
      transition: transform 0.5s ease, opacity 0.5s ease, color 0.5s ease;
    }

    @keyframes stepIn {
      0% {
        opacity: 0;
        transform: translateY(30px) rotate(15deg);
      }
      50% {
        opacity: 0.5;
        transform: translateY(10px) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0);
        color: #d1b172;
      }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      background-color: #3e3d36;
      color: #e8e4d9;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        gap: 15px;
      }

      .brand {
        font-size: 1.8rem;
      }

      nav a {
        font-size: 1rem;
      }

      .slogan {
        font-size: 1.4rem;
        padding: 0 10px;
      }

      .model, .product {
        width: 90%;
      }

      .brand-summary p,
      .about p {
        font-size: 1rem;
        padding: 0 10px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .product,
      .model {
        width: 45%;
      }
    }

    @media (min-width: 1025px) {
      .product,
      .model {
        width: 28%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">EarthBound</div>
    <nav>
      <ul>
        <li><a href="Drops.html"><i class="fas fa-fire"></i> Drops</a></li>
        <li><a href="about.html"><i class="fas fa-user"></i> About</a></li>
        <li><a href="contacts.html"><i class="fas fa-envelope"></i> Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="slogan-section">
    <div class="slogan">Step Into Style</div>
  </section>

  <footer>
    <p>© 2025 EarthBound. All rights reserved.</p>
  </footer>

  <script>
    const fadeEls = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });
    fadeEls.forEach(el => observer.observe(el));
  </script>

</body>
</html>
